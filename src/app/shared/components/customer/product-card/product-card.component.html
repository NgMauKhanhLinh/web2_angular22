<article class="home-product-card">
  <div class="home-product-media">
    <a [routerLink]="['/product-details', product().id]" class="home-product-image">
      <img [src]="product().image" [alt]="product().name" />
    </a>
    <button
      class="home-product-cart"
      type="button"
      [attr.aria-label]="'Thêm ' + product().name + ' vào giỏ hàng'"
      (click)="onAddToCart($event)"
    >
      <img src="/assets/customer/images/home/cart-black.svg" alt="Giỏ hàng" />
    </button>
  </div>
  <div class="home-product-copy">
    <span class="home-product-category">{{ product().category }}</span>
    <a [routerLink]="['/product-details', product().id]">{{ product().name }}</a>
    <div class="home-product-meta">
      <span aria-label="Đánh giá 4.5 trên 5">★★★★★</span>
      <strong>{{ formatPrice(product().price) }}</strong>
    </div>
  </div>
</article>
